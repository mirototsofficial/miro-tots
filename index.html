<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Miro Tots | Kids Learning Tools</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="%23f59e0b"/></svg>'>
<style>
  :root{
    --amber:#f59e0b;
    --amber-dark:#d97706;
    --cream:#fffbeb;
    --line:#fcd34d;
    --ink:#3f3a33;
    --muted:#7a7269;
    --green:#22c55e;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:var(--cream);
    color:var(--ink);
    font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;
    padding:18px 14px 32px;
    -webkit-text-size-adjust:100%;
  }
  .hero{
    max-width:1180px;margin:0 auto 22px;
    background:linear-gradient(160deg,#fffbeb 0%,#fef3c7 100%);
    border:2px solid #fde68a;border-radius:24px;
    padding:20px 18px;
    display:grid;grid-template-columns:1fr;gap:14px;align-items:center;
  }
  @media (min-width:760px){
    .hero{grid-template-columns:1.15fr .85fr;padding:30px 34px;gap:26px}
  }
  .hero h1{
    color:#d97706;font-size:clamp(2.1rem,8vw,3.1rem);
    line-height:1.02;letter-spacing:-.5px;
  }
  .tagline{color:#6b6257;font-size:1rem;line-height:1.5;margin:10px 0 12px;max-width:36ch}
  .hero-badges{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .badge{
    background:#fff;border:1px solid var(--line);border-radius:999px;
    padding:4px 10px;font-size:.78rem;color:#b45309;font-weight:bold;
  }
  .star-bar{
    display:inline-block;background:#fff;border:2px solid var(--line);
    border-radius:999px;padding:6px 16px;font-weight:bold;
    color:var(--amber-dark);font-size:.95rem;
  }
  .hero-cta{
    display:inline-block;margin-top:16px;background:var(--amber);color:#fff;
    text-decoration:none;font-weight:bold;padding:13px 24px;border-radius:12px;
    min-height:48px;box-shadow:0 4px 0 #d97706;font-size:1rem;
  }
  .hero-cta:active{transform:translateY(2px);box-shadow:0 2px 0 #d97706}
  .hero-art{text-align:center}
  .hi{
    display:inline-block;background:#fff;border:2px solid var(--line);
    border-radius:999px;padding:6px 14px;font-weight:bold;color:#b45309;
    font-size:.92rem;margin-bottom:10px;
  }
  .hero-art img{
    width:100%;max-width:230px;height:auto;display:block;margin:0 auto;
    border-radius:20px;border:3px solid var(--line);background:#fff;
    box-shadow:0 8px 20px rgba(217,119,6,.18);
  }
  @media (min-width:760px){.hero-art img{max-width:300px}}
  .sec-title{
    max-width:1180px;margin:0 auto 14px;color:var(--amber-dark);
    font-size:1.05rem;font-weight:bold;
  }
  .cards{
    max-width:1180px;margin:0 auto;
    display:grid;grid-template-columns:1fr;gap:14px;
  }
  @media (min-width:620px){.cards{grid-template-columns:repeat(3,1fr);gap:18px}}
  @media (min-width:1000px){.cards{grid-template-columns:repeat(5,1fr);gap:18px}}
  .tool-card{
    background:#fff;border-radius:16px;padding:18px 16px;
    border:2px solid var(--line);cursor:pointer;
    box-shadow:0 3px 10px rgba(0,0,0,.06);
    transition:transform .18s ease,box-shadow .18s ease;
    text-align:left;font:inherit;color:inherit;width:100%;
  }
  .tool-card:hover,.tool-card:focus-visible{
    transform:translateY(-4px);
    box-shadow:0 8px 18px rgba(245,158,11,.22);
    outline:none;border-color:var(--amber);
  }
  .tool-card h3{color:var(--amber-dark);font-size:1.05rem;margin-bottom:6px}
  .tool-card p{color:var(--muted);font-size:.9rem;line-height:1.45}
  .tool-card .new{
    display:inline-block;font-size:.7rem;font-weight:bold;letter-spacing:.04em;
    color:#fff;background:var(--green);border-radius:999px;padding:2px 8px;margin-bottom:8px;
  }
  .modal{
    display:none;position:fixed;inset:0;background:rgba(30,25,20,.62);
    align-items:center;justify-content:center;padding:14px;z-index:999;
  }
  .modal-content{
    background:#fff;border-radius:18px;padding:22px 18px;
    width:100%;max-width:640px;max-height:88vh;overflow-y:auto;position:relative;
  }
  .modal-content h2{color:var(--amber-dark);font-size:1.25rem;margin-bottom:14px;padding-right:34px}
  .close-btn{
    position:absolute;top:10px;right:12px;font-size:26px;line-height:1;
    background:none;border:0;color:#a09a90;cursor:pointer;padding:6px;
  }
  .close-btn:hover{color:var(--amber-dark)}
  input[type=text]{
    padding:10px 14px;margin:8px 0;border-radius:10px;border:1px solid #ddd;
    font-size:16px;width:100%;
  }
  button.btn{
    padding:11px 16px;margin:8px 6px 0 0;border-radius:10px;border:0;
    background:var(--amber);color:#fff;font-weight:bold;font-size:1rem;
    cursor:pointer;min-height:44px;
  }
  button.btn:hover{background:var(--amber-dark)}
  button.btn.ghost{background:#fff;color:var(--amber-dark);border:2px solid var(--line)}
  canvas{border:2px solid var(--line);border-radius:12px;background:#fff;max-width:100%;height:auto;display:block;margin:10px 0}
  .status{font-size:1.05rem;font-weight:bold;color:var(--amber-dark);text-align:center;margin:8px 0}

  /* ---- phonics ---- */
  .letter-badge{
    width:92px;height:92px;margin:6px auto 10px;border-radius:22px;
    background:linear-gradient(180deg,#fef3c7,#fde68a);
    border:3px solid var(--amber);
    display:flex;align-items:center;justify-content:center;
    font-size:2.6rem;font-weight:bold;color:#b45309;
  }
  .question{text-align:center;font-size:1.05rem;color:var(--ink);margin-bottom:14px}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .tile{
    background:var(--cream);border:2px solid var(--line);border-radius:14px;
    min-height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;cursor:pointer;font:inherit;padding:8px;transition:transform .15s,border-color .15s;
  }
  .tile:hover{border-color:var(--amber);transform:translateY(-3px)}
  .tile .emoji{font-size:2rem;line-height:1}
  .tile .word{font-size:.85rem;color:var(--muted)}
  .tile.right{background:#dcfce7;border-color:var(--green)}
  .tile.wrong{background:#fee2e2;border-color:#ef4444}
  .tile.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

  /* ---- counting ---- */
  .count-stage{
    min-height:170px;background:var(--cream);border:2px dashed var(--line);
    border-radius:16px;display:flex;flex-wrap:wrap;align-items:center;
    justify-content:center;gap:8px;padding:14px;margin-bottom:14px;
  }
  .count-object{font-size:2rem;line-height:1;opacity:0;transform:scale(.4);animation:pop .3s forwards}
  @keyframes pop{to{opacity:1;transform:scale(1)}}
  .num-options{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .num-btn{
    min-height:64px;font-size:1.6rem;font-weight:bold;border-radius:14px;
    background:#fff;border:2px solid var(--line);color:#b45309;cursor:pointer;
    font-family:inherit;
  }
  .num-btn:hover{border-color:var(--amber);background:var(--cream)}

  /* ---- patterns ---- */
  .pattern-row{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    background:var(--cream);border:2px dashed var(--line);border-radius:16px;
    padding:16px 10px;margin-bottom:14px;min-height:90px;align-items:center;
  }
  .pShape{width:46px;height:46px;flex:0 0 auto;display:block}
  .pShape.circle{border-radius:50%}
  .pShape.square{border-radius:8px}
  .pShape.triangle{clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0}
  .pShape.star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
  .qmark{
    width:46px;height:46px;border-radius:10px;border:2px dashed var(--amber);
    display:flex;align-items:center;justify-content:center;color:var(--amber-dark);
    font-weight:bold;font-size:1.3rem;
  }

  /* ---- drawing ---- */
  .palette{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
  .swatch{
    width:40px;height:40px;border-radius:50%;border:3px solid #fff;
    box-shadow:0 0 0 2px #e5e7eb;cursor:pointer;padding:0;
  }
  .swatch.active{box-shadow:0 0 0 3px var(--amber-dark)}
  .draw-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
  .size-btn{
    width:40px;height:40px;border-radius:10px;border:2px solid var(--line);
    background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .size-btn.active{border-color:var(--amber-dark);background:var(--cream)}
  .dot{display:block;border-radius:50%;background:#333}
  .draw-canvas{touch-action:none;cursor:crosshair}

  .star-bar{
    display:inline-block;margin-top:10px;background:#fff;
    border:2px solid var(--line);border-radius:999px;
    padding:6px 16px;font-weight:bold;color:var(--amber-dark);font-size:.95rem;
  }
  .dpad{
    display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);
    gap:6px;justify-content:center;margin:12px auto;
  }
  .dpad .dbtn:nth-child(1){grid-area:1/2}
  .dpad .dbtn:nth-child(2){grid-area:2/1}
  .dpad .dbtn:nth-child(3){grid-area:2/3}
  .dpad .dbtn:nth-child(4){grid-area:3/2}
  .dbtn{
    background:#fff;border:2px solid var(--line);border-radius:12px;
    font-size:1.3rem;color:var(--amber-dark);cursor:pointer;font-family:inherit;
  }
  .dbtn:active{background:var(--cream)}
  .print-list{display:grid;gap:10px;margin-top:6px}
  .print-row{
    background:var(--cream);border:2px solid var(--line);border-radius:14px;
    padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;
    justify-content:space-between;gap:10px;
  }
  .print-row span{font-size:.95rem}
  .print-row .btn{margin:0}

  /* ---- existing games ---- */
  .memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:420px;margin:14px auto}
  .memory-card{
    height:72px;background:var(--amber);border-radius:12px;display:flex;
    align-items:center;justify-content:center;font-size:26px;color:#fff;
    cursor:pointer;transition:.25s;border:0;font-family:inherit;
  }
  .memory-card.flipped{background:var(--cream);color:var(--ink);border:2px solid var(--amber)}
  .memory-card.matched{background:#86efac;cursor:default;color:var(--ink)}
  #memoryStatus,#puzzleStatus{font-size:1.05rem;color:var(--amber-dark);font-weight:bold;text-align:center}
  .puzzle-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:330px;margin:14px auto}
  .puzzle-cell{
    height:88px;background:#fbbf24;border-radius:10px;display:flex;
    align-items:center;justify-content:center;font-size:26px;font-weight:bold;
    color:#fff;cursor:pointer;border:0;font-family:inherit;
  }
  .puzzle-cell.empty{background:var(--cream);cursor:default}
  #wheelResult{font-size:1.2rem;font-weight:bold;color:var(--amber-dark);margin-top:10px;text-align:center}
  footer{text-align:center;margin-top:34px;color:var(--muted);font-size:.85rem}
</style>
</head>
<body>
<section class="hero">
  <div class="hero-text">
    <h1>Miro Tots</h1>
    <p class="tagline">Free letter, number and colour games that little kids can play on their own — no sign-up, no ads.</p>
    <div class="hero-badges">
      <span class="badge">No login needed</span>
      <span class="badge">Safe for kids</span>
      <span class="badge">Works offline</span>
    </div>
    <div class="star-bar" id="starBar">Stars: 0</div>
    <br>
    <a class="hero-cta" href="#tools">Start learning</a>
  </div>
  <div class="hero-art">
    <span class="hi">Hi, I&rsquo;m Miro!</span>
    <img src="https://media.doubao.com/space/api/box/stream/download/all_by_mount_point/GbXXbgdNxocOVYx81NecldmJnSh" alt="Miro, the Miro Tots character" width="700" height="1178">
  </div>
</section>

<p class="sec-title">20 learning tools</p>

<div class="cards" id="tools">
  <button class="tool-card" data-tool="flashcard"><h3>Alphabet Flashcards</h3><p>Learn A–Z with picture words</p></button>
  <button class="tool-card" data-tool="phonics"><span class="new">NEW</span><h3>Phonics Sound Match</h3><p>Hear the letter sound, pick the right picture</p></button>
  <button class="tool-card" data-tool="counting"><span class="new">NEW</span><h3>Counting Fun</h3><p>Count the objects, tap the number</p></button>
  <button class="tool-card" data-tool="pattern"><span class="new">NEW</span><h3>Pattern Play</h3><p>Spot the pattern, pick what comes next</p></button>
  <button class="tool-card" data-tool="draw"><span class="new">NEW</span><h3>Draw &amp; Play</h3><p>Free drawing with colours and brush sizes</p></button>
  <button class="tool-card" data-tool="odd"><span class="new">NEW</span><h3>Odd One Out</h3><p>Spot the picture that does not belong</p></button>
  <button class="tool-card" data-tool="animal"><span class="new">NEW</span><h3>Animal Sounds</h3><p>Tap an animal, hear it speak</p></button>
  <button class="tool-card" data-tool="dots"><span class="new">NEW</span><h3>Dot to Dot</h3><p>Join the numbers to make a star</p></button>
  <button class="tool-card" data-tool="maze"><span class="new">NEW</span><h3>Maze Runner</h3><p>Find the way to the star</p></button>
  <button class="tool-card" data-tool="mathquiz"><h3>Math Quiz</h3><p>Simple adding and taking away</p></button>
  <button class="tool-card" data-tool="spell"><h3>Spelling Practice</h3><p>Build first words letter by letter</p></button>
  <button class="tool-card" data-tool="sightwords"><h3>Sight Words</h3><p>High frequency words for early readers</p></button>
  <button class="tool-card" data-tool="shape"><h3>Shape Recognition</h3><p>Circles, squares, triangles and more</p></button>
  <button class="tool-card" data-tool="trace"><h3>Letter Tracing</h3><p>Dashed guide lines, download as PDF</p></button>
  <button class="tool-card" data-tool="print"><span class="new">NEW</span><h3>Printables</h3><p>All worksheets and a certificate in one place</p></button>
  <button class="tool-card" data-tool="color"><h3>Coloring Page</h3><p>Colour a cat, download as PDF</p></button>
  <button class="tool-card" data-tool="wheel"><h3>Lucky Spin Wheel</h3><p>Spin to pick a random word</p></button>
  <button class="tool-card" data-tool="memory"><h3>Memory Match</h3><p>Flip cards and find animal pairs</p></button>
  <button class="tool-card" data-tool="puzzle"><h3>3×3 Sliding Puzzle</h3><p>Slide the numbers into order</p></button>
  <button class="tool-card" data-tool="qrcode"><h3>QR Generator</h3><p>Turn text or a link into a QR code</p></button>
</div>

<div class="modal" id="modal">
  <div class="modal-content">
    <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
    <div id="modal-body"></div>
  </div>
</div>

<footer>&copy; 2026 Miro Tots</footer>

<script src="https://fastly.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js" defer></script>
<script src="https://fastly.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js" defer></script>
<script>
/* ============ shared ============ */
var modal = document.getElementById('modal');
var body = document.getElementById('modal-body');
var currentTool = null;

/* ---- star progress ---- */
var STARS = 0;
try { STARS = Number(localStorage.getItem('miroTotsStars') || 0) || 0; } catch(e){ STARS = 0; }
function paintStars(){
  var el = document.getElementById('starBar');
  if(el) el.textContent = 'Stars: ' + STARS;
}
function addStar(n){
  STARS += (n || 1);
  try { localStorage.setItem('miroTotsStars', STARS); } catch(e){}
  paintStars();
}
function resetStars(){
  STARS = 0;
  try { localStorage.setItem('miroTotsStars', 0); } catch(e){}
  paintStars();
}
paintStars();

function speak(text, rate){
  try{
    if(!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = rate || 0.9;
    u.pitch = 1.15;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function openModal(tool){
  currentTool = tool;
  modal.style.display = 'flex';
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  render(tool);
}
function closeModal(){
  modal.style.display = 'none';
  currentTool = null;
  if(window.speechSynthesis) window.speechSynthesis.cancel();
}
document.getElementById('closeBtn').onclick = closeModal;
modal.addEventListener('click', function(e){ if(e.target === modal) closeModal(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeModal(); });
document.querySelectorAll('.tool-card').forEach(function(card){
  card.addEventListener('click', function(){ openModal(card.dataset.tool); });
});

function render(tool){
  if(tool === 'phonics') startPhonics();
  else if(tool === 'counting') newCounting();
  else if(tool === 'pattern') newPattern();
  else if(tool === 'draw') initDraw();
  else if(tool === 'odd') startOdd();
  else if(tool === 'animal') startAnimals();
  else if(tool === 'maze') initMaze();
  else if(tool === 'dots') initDots();
  else if(tool === 'print') showPrintables();
  else if(tool === 'flashcard') showFlashcards();
  else if(tool === 'mathquiz') showMath();
  else if(tool === 'spell') showSpell();
  else if(tool === 'sightwords') showSightWords();
  else if(tool === 'shape') showShapes();
  else if(tool === 'trace') { body.innerHTML = '<h2>Letter Tracing Worksheet</h2><canvas id="tracingCanvas" width="500" height="320"></canvas><button class="btn" id="dlTrace">Download PDF</button>'; drawTracing(); document.getElementById('dlTrace').onclick = downloadTracingPDF; }
  else if(tool === 'color') { body.innerHTML = '<h2>Coloring Page</h2><canvas id="colorCanvas" width="500" height="320"></canvas><button class="btn" id="dlColor">Download PDF</button>'; drawColoring(); document.getElementById('dlColor').onclick = downloadColorPDF; }
  else if(tool === 'wheel') { body.innerHTML = '<h2>Lucky Spin Wheel</h2><canvas id="wheelCanvas" width="400" height="400"></canvas><button class="btn" id="spinBtn">Spin the Wheel</button><div id="wheelResult"></div>'; drawWheel(); document.getElementById('spinBtn').onclick = spinWheel; }
  else if(tool === 'memory') initMemoryGame();
  else if(tool === 'puzzle') initPuzzle();
  else if(tool === 'qrcode') { body.innerHTML = '<h2>QR Code Generator</h2><input type="text" id="qrtext" placeholder="Type text or a link"><br><button class="btn" id="qrBtn">Generate QR Code</button><div id="qrbox" style="margin-top:14px"></div>'; document.getElementById('qrBtn').onclick = makeQR; }
}

/* ============ 1. phonics ============ */
var PHONICS = [
  {l:'A', w:'Apple', e:'🍎'}, {l:'B', w:'Ball', e:'⚽'}, {l:'C', w:'Cat', e:'🐱'},
  {l:'D', w:'Dog', e:'🐶'}, {l:'E', w:'Egg', e:'🥚'}, {l:'F', w:'Fish', e:'🐟'},
  {l:'G', w:'Grapes', e:'🍇'}, {l:'H', w:'Hat', e:'👒'}, {l:'I', w:'Ice cream', e:'🍦'},
  {l:'J', w:'Juice', e:'🧃'}, {l:'K', w:'Kite', e:'🪁'}, {l:'L', w:'Lion', e:'🦁'},
  {l:'M', w:'Monkey', e:'🐵'}, {l:'N', w:'Nose', e:'👃'}, {l:'O', w:'Orange', e:'🍊'},
  {l:'P', w:'Pizza', e:'🍕'}, {l:'Q', w:'Queen', e:'👑'}, {l:'R', w:'Rabbit', e:'🐰'},
  {l:'S', w:'Sun', e:'☀️'}, {l:'T', w:'Tiger', e:'🐯'}, {l:'U', w:'Umbrella', e:'☂️'},
  {l:'V', w:'Violin', e:'🎻'}, {l:'W', w:'Watermelon', e:'🍉'}, {l:'Y', w:'Yo-yo', e:'🪀'},
  {l:'Z', w:'Zebra', e:'🦓'}
];
var phScore = 0, phLocked = false;

function startPhonics(){
  phScore = 0;
  body.innerHTML =
    '<h2>Phonics Sound Match</h2>' +
    '<div class="status" id="phScore">Stars: 0</div>' +
    '<div id="phGame"></div>';
  nextPhonics();
}
function pickOther(list, exclude, n){
  var pool = list.filter(function(x){ return x.l !== exclude.l; });
  var out = [];
  while(out.length < n && pool.length){
    var i = Math.floor(Math.random() * pool.length);
    out.push(pool[i]);
    pool.splice(i, 1);
  }
  return out;
}
function nextPhonics(){
  if(!body.querySelector('#phGame')) return;
  phLocked = false;
  var target = PHONICS[Math.floor(Math.random() * PHONICS.length)];
  var others = pickOther(PHONICS, target, 2);
  var opts = [target].concat(others).sort(function(){ return Math.random() - 0.5; });
  var html =
    '<div class="letter-badge">' + target.l + '</div>' +
    '<p class="question">Which picture starts with <b>' + target.l + '</b>?</p>' +
    '<div class="tiles" id="phTiles">';
  opts.forEach(function(o, i){
    html += '<button class="tile" data-i="' + i + '"><span class="emoji">' + o.e +
            '</span><span class="word">' + o.w + '</span></button>';
  });
  html += '</div><div style="text-align:center;margin-top:12px">' +
          '<button class="btn ghost" id="phHear">Hear the letter</button>' +
          '<button class="btn ghost" id="phSkip">Next one</button></div>';
  document.getElementById('phGame').innerHTML = html;
  speak('Which picture starts with ' + target.l + '?');

/* ============ 3. patterns ============ */
var P_COLORS = ['#ef4444','#3b82f6','#f59e0b','#10b981','#8b5cf6','#ec4899'];
var P_SHAPES = ['circle','square','triangle','star'];
var patternAns = null, patternLocked = false, patternScore = 0;

function randPatternItem(){
  return {
    s: P_SHAPES[Math.floor(Math.random() * P_SHAPES.length)],
    c: P_COLORS[Math.floor(Math.random() * P_COLORS.length)]
  };
}
function shapeHTML(item, extra){
  return '<div class="pShape ' + item.s + '" style="background:' + item.c + '"></div>' + (extra || '');
}
function sameItem(a, b){ return a.s === b.s && a.c === b.c; }

function newPattern(){
  patternLocked = false;
  var kinds = ['AB','AAB','ABC','ABB'];
  var kind = kinds[Math.floor(Math.random() * kinds.length)];
  var a = randPatternItem(), b, c;
  do { b = randPatternItem(); } while(sameItem(a, b));
  do { c = randPatternItem(); } while(sameItem(a, c) || sameItem(b, c));

  var seq, ans;
  if(kind === 'AB'){ seq = [a, b, a, b, a]; ans = b; }
  else if(kind === 'AAB'){ seq = [a, a, b, a, a]; ans = b; }
  else if(kind === 'ABB'){ seq = [a, b, b, a, b]; ans = b; }
  else { seq = [a, b, c, a, b]; ans = c; }

  patternAns = ans;
  var opts = [ans];
  var pool = [a, b, c].filter(function(x){ return !sameItem(x, ans); });
  while(opts.length < 3 && pool.length){
    var i = Math.floor(Math.random() * pool.length);
    opts.push(pool[i]);
    pool.splice(i, 1);
  }
  while(opts.length < 3){
    var extra = randPatternItem();
    if(opts.some(function(x){ return sameItem(x, extra); })) continue;
    opts.push(extra);
  }
  opts.sort(function(){ return Math.random() - 0.5; });

  body.innerHTML =
    '<h2>Pattern Play</h2>' +
    '<div class="status" id="pScore">Stars: ' + patternScore + '</div>' +
    '<p class="question">What comes next?</p>' +
    '<div class="pattern-row" id="pRow">' +
      seq.map(function(it){ return shapeHTML(it); }).join('') +
      '<div class="qmark">?</div>' +
    '</div>' +
    '<div class="tiles" id="pOpts">' +
      opts.map(function(o, i){
        return '<button class="tile" data-i="' + i + '" style="min-height:78px">' +
               '<div class="pShape ' + o.s + '" style="background:' + o.c + '"></div></button>';
      }).join('') +
    '</div>' +
    '<div style="text-align:center;margin-top:12px"><button class="btn ghost" id="pNew">New pattern</button></div>';
  document.getElementById('pNew').onclick = newPattern;

  document.getElementById('pOpts').addEventListener('click', function(ev){
    var btn = ev.target.closest('.tile');
    if(!btn || patternLocked) return;
    var choice = opts[Number(btn.dataset.i)];
    if(sameItem(choice, patternAns)){
      patternLocked = true;
      patternScore++;
      addStar();
      document.getElementById('pScore').textContent = 'Stars: ' + patternScore;
      document.getElementById('pRow').innerHTML =
        seq.map(function(it){ return shapeHTML(it); }).join('') + shapeHTML(patternAns);
      btn.classList.add('right');
      speak('Yes! That is the pattern. Well done!');
      setTimeout(newPattern, 1500);
    }else{
      btn.classList.add('wrong', 'shake');
      speak('Look at the pattern again');
      setTimeout(function(){ btn.classList.remove('wrong', 'shake'); }, 600);
    }
  });
}

function initDraw(){

  var pal = document.getElementById('palette');
  colors.forEach(function(c, i){
    var b = document.createElement('button');
    b.className = 'swatch' + (i === 0 ? ' active' : '');
    b.style.background = c;
    b.setAttribute('aria-label', 'Colour ' + (i + 1));
    b.onclick = function(){
      brushColor = c;
      erasing = false;
      document.getElementById('eraserBtn').textContent = 'Eraser';
      pal.querySelectorAll('.swatch').forEach(function(s){ s.classList.remove('active'); });
      b.classList.add('active');
    };
    pal.appendChild(b);
  });

  document.querySelectorAll('.size-btn').forEach(function(b){
    b.onclick = function(){
      brushSize = Number(b.dataset.size);
      document.querySelectorAll('.size-btn').forEach(function(x){ x.classList.remove('active'); });
      b.classList.add('active');
    };
  });
  document.getElementById('eraserBtn').onclick = function(){
    erasing = !erasing;
    this.textContent = erasing ? 'Drawing' : 'Eraser';
  };
  document.getElementById('clearBtn').onclick = function(){
    drawCtx.clearRect(0, 0, 640, 420);
  };
  document.getElementById('saveBtn').onclick = function(){
    var a = document.createElement('a');
    a.download = 'miro-tots-drawing.png';
    a.href = document.getElementById('drawCanvas').toDataURL('image/png');
    a.click();
  };

  var canvas = document.getElementById('drawCanvas');
  drawCtx = canvas.getContext('2d');
  drawCtx.fillStyle = '#ffffff';
  drawCtx.fillRect(0, 0, 640, 420);

  function pos(ev){
    var r = canvas.getBoundingClientRect();
    return {
      x: (ev.clientX - r.left) * (canvas.width / r.width),
      y: (ev.clientY - r.top) * (canvas.height / r.height)
    };
  }
  canvas.addEventListener('pointerdown', function(ev){
    drawing = true;
    canvas.setPointerCapture(ev.pointerId);
    var p = pos(ev);
    drawCtx.beginPath();
    drawCtx.moveTo(p.x, p.y);
    drawCtx.lineJoin = drawCtx.lineCap = 'round';
    drawCtx.lineWidth = brushSize;
    drawCtx.strokeStyle = erasing ? '#ffffff' : brushColor;
     ev.preventDefault();
  });
  canvas.addEventListener('pointermove', function(ev){
    if(!drawing) return;
    var p = pos(ev);
    drawCtx.lineTo(p.x, p.y);
    drawCtx.stroke();
    ev.preventDefault();
  });
  ['pointerup','pointerleave','pointercancel'].forEach(function(t){
    canvas.addEventListener(t, function(){ drawing = false; });
  });
}

/* ============ 7. maze ============ */
var MW = 7, MH = 7, maze = [], mazePlayer = { x:0, y:0 }, mazeDone = false, mazeCanvas = null;

function initMaze(){
  maze = [];
  for(var y = 0; y < MH; y++){
    var row = [];
    for(var x = 0; x < MW; x++) row.push({ n:true, e:true, s:true, w:true, v:false });
    maze.push(row);
  }
  var stack = [[0, 0]];
  maze[0][0].v = true;
  while(stack.length){
    var cur = stack[stack.length - 1];
    var cx = cur[0], cy = cur[1];
    var nb = [];
    if(cy > 0 && !maze[cy-1][cx].v) nb.push([cx, cy-1, 'n', 's']);
    if(cy < MH-1 && !maze[cy+1][cx].v) nb.push([cx, cy+1, 's', 'n']);
    if(cx > 0 && !maze[cy][cx-1].v) nb.push([cx-1, cy, 'w', 'e']);
    if(cx < MW-1 && !maze[cy][cx+1].v) nb.push([cx+1, cy, 'e', 'w']);
    if(!nb.length){ stack.pop(); continue; }
    var p = nb[Math.floor(Math.random() * nb.length)];
    maze[cy][cx][p[2]] = false;
    maze[p[1]][p[0]][p[3]] = false;
    maze[p[1]][p[0]].v = true;
    stack.push([p[0], p[1]]);
  }
  mazePlayer = { x:0, y:0 };
  mazeDone = false;
  body.innerHTML =
    '<h2>Maze Runner</h2>' +
    '<div class="status" id="mazeStatus">Find the way to the star</div>' +
    '<canvas id="mazeCanvas" width="350" height="350" style="margin:0 auto"></canvas>' +
    '<div class="dpad">' +
      '<button class="dbtn" data-dir="up" aria-label="Up">▲</button>' +
      '<button class="dbtn" data-dir="left" aria-label="Left">◀</button>' +
      '<button class="dbtn" data-dir="right" aria-label="Right">▶</button>' +
      '<button class="dbtn" data-dir="down" aria-label="Down">▼</button>' +
    '</div>' +
    '<div style="text-align:center"><button class="btn ghost" id="mazeNew">New maze</button></div>';
  mazeCanvas = document.getElementById('mazeCanvas');
  document.getElementById('mazeNew').onclick = initMaze;
  body.querySelectorAll('.dbtn').forEach(function(b){
    b.onclick = function(){ moveMaze(b.dataset.dir); };
  });
  drawMaze();
}
function drawMaze(){
  if(!mazeCanvas || !maze.length) return;
  var ctx = mazeCanvas.getContext('2d');
  var cs = 50;
  ctx.clearRect(0, 0, 350, 350);
  ctx.fillStyle = '#fffbeb';
  ctx.fillRect(0, 0, 350, 350);
  ctx.strokeStyle = '#d97706';
  ctx.lineWidth = 3;
  for(var y = 0; y < MH; y++){
    for(var x = 0; x < MW; x++){
      var c = maze[y][x];
      var px = x * cs, py = y * cs;
      if(c.n){ ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px + cs, py); ctx.stroke(); }
      if(c.w){ ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(px, py + cs); ctx.stroke(); }
      if(y === MH - 1 && c.s){ ctx.beginPath(); ctx.moveTo(px, py + cs); ctx.lineTo(px + cs, py + cs); ctx.stroke(); }
      if(x === MW - 1 && c.e){ ctx.beginPath(); ctx.moveTo(px + cs, py); ctx.lineTo(px + cs, py + cs); ctx.stroke(); }
    }
  }
  ctx.fillStyle = '#f59e0b';
  ctx.font = '30px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('★', (MW - 1) * cs + cs / 2, (MH - 1) * cs + cs / 2);
  ctx.beginPath();
  ctx.arc(mazePlayer.x * cs + cs / 2, mazePlayer.y * cs + cs / 2, 14, 0, Math.PI * 2);
  ctx.fillStyle = '#3b82f6';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();
}
function moveMaze(dir){
  if(!maze.length || mazeDone) return;
  var c = maze[mazePlayer.y][mazePlayer.x];
  var dx = 0, dy = 0, wall = false;
  if(dir === 'up'){ wall = c.n; dy = -1; }
  else if(dir === 'down'){ wall = c.s; dy = 1; }
  else if(dir === 'left'){ wall = c.w; dx = -1; }
  else if(dir === 'right'){ wall = c.e; dx = 1; }
  if(wall) return;
  mazePlayer.x += dx;
  mazePlayer.y += dy;
  drawMaze();
  if(mazePlayer.x === MW - 1 && mazePlayer.y === MH - 1){
    mazeDone = true;
    addStar();
    speak('You found the star! Well done!');
    var st = document.getElementById('mazeStatus');
    if(st) st.textContent = 'You reached the star!';
  }
}
document.addEventListener('keydown', function(e){
  if(currentTool !== 'maze') return;
  var map = { ArrowUp:'up', ArrowDown:'down', ArrowLeft:'left', ArrowRight:'right' };
  if(map[e.key]){ e.preventDefault(); moveMaze(map[e.key]); }
});

/* ============ 8. dot to dot ============ */
var DOT_TOTAL = 10, dotNext = 0, dotPts = [], dotDone = false;

function initDots(){
  dotNext = 0;
  dotDone = false;
  dotPts = [];
  var cx = 175, cy = 175, ro = 138, ri = 56;
  for(var i = 0; i < DOT_TOTAL; i++){
    var ang = -Math.PI / 2 + i * Math.PI / 5;
    var r = (i % 2 === 0) ? ro : ri;
    dotPts.push({ x: cx + Math.cos(ang) * r, y: cy + Math.sin(ang) * r });
  }
  body.innerHTML =
    '<h2>Dot to Dot</h2>' +
    '<p class="question">Tap the dots in order, 1 to 10</p>' +
    '<canvas id="dotsCanvas" width="350" height="350" style="margin:0 auto"></canvas>' +
    '<div class="status" id="dotsStatus">Next dot: 1</div>' +
    '<div style="text-align:center"><button class="btn ghost" id="dotsNew">Start again</button></div>';
  document.getElementById('dotsNew').onclick = initDots;
  drawDots();
  document.getElementById('dotsCanvas').addEventListener('click', function(ev){
    if(dotDone) return;
    var cv = ev.currentTarget;
    var rect = cv.getBoundingClientRect();
    var x = (ev.clientX - rect.left) * (cv.width / rect.width);
    var y = (ev.clientY - rect.top) * (cv.height / rect.height);
    for(var i = 0; i < dotPts.length; i++){
      if(Math.hypot(dotPts[i].x - x, dotPts[i].y - y) < 22){
        if(i === dotNext){
          dotNext++;
          drawDots();
          if(dotNext === DOT_TOTAL){
            dotDone = true;
            addStar();
            speak('You made a star! Well done!');
            document.getElementById('dotsStatus').textContent = 'You made a star!';
          }else{
            document.getElementById('dotsStatus').textContent = 'Next dot: ' + (dotNext + 1);
          }
        }else{
          speak('Find number ' + (dotNext + 1));
        }
        return;
      }
    }
  });
}
function drawDots(){
  var cv = document.getElementById('dotsCanvas');
  if(!cv) return;
  var ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, 350, 350);
  ctx.fillStyle = '#fffbeb';
  ctx.fillRect(0, 0, 350, 350);
  ctx.strokeStyle = '#3b82f6';
  ctx.lineWidth = 3;
  for(var i = 0; i < dotNext - 1; i++){
    ctx.beginPath();
    ctx.moveTo(dotPts[i].x, dotPts[i].y);
    ctx.lineTo(dotPts[i + 1].x, dotPts[i + 1].y);
    ctx.stroke();
  }
  if(dotDone){
    ctx.beginPath();
    ctx.moveTo(dotPts[DOT_TOTAL - 1].x, dotPts[DOT_TOTAL - 1].y);
    ctx.lineTo(dotPts[0].x, dotPts[0].y);
    ctx.stroke();
  }
  for(var j = 0; j < dotPts.length; j++){
    ctx.beginPath();
    ctx.arc(dotPts[j].x, dotPts[j].y, 12, 0, Math.PI * 2);
    ctx.fillStyle = j < dotNext ? '#22c55e' : '#f59e0b';
    ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 11px "Trebuchet MS", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(j + 1), dotPts[j].x, dotPts[j].y);
  }
}

    else if(btn.dataset.print === 'certP') downloadCertificate();

}
function withSheet(canvasId, drawFn, filename){
  var c = document.createElement('canvas');

function showMath(){
  var a = Math.floor(Math.random() * 9) + 1;
  var b = Math.floor(Math.random() * 9) + 1;
  var take = Math.random() > 0.5 && a > b;
  var answer = take ? a - b : a + b;
  var opts = [answer];
  while(opts.length < 3){
    var c = answer + (Math.floor(Math.random() * 5) - 2);
    if(c < 0 || opts.indexOf(c) !== -1) continue;
    opts.push(c);
  }
  opts.sort(function(){ return Math.random() - 0.5; });
  body.innerHTML = '<h2>Math Quiz</h2><div class="letter-badge" style="width:auto;padding:0 22px;height:80px;font-size:1.9rem">' +
    a + (take ? ' − ' : ' + ') + b + ' = ?</div>' +
    '<div class="num-options" id="mathOpts">' +
      opts.map(function(n){ return '<button class="num-btn" data-n="' + n + '">' + n + '</button>'; }).join('') +
    '</div><div style="text-align:center;margin-top:12px"><button class="btn ghost" id="mathNew">New question</button></div>';
  document.getElementById('mathNew').onclick = showMath;
  document.getElementById('mathOpts').addEventListener('click', function(ev){
    var btn = ev.target.closest('.num-btn');
    if(!btn) return;
    if(Number(btn.dataset.n) === answer){
      btn.style.background = '#dcfce7';
      btn.style.borderColor = '#22c55e';
      addStar();
      speak('Correct! ' + answer);
      setTimeout(showMath, 1200);
    }else{
      btn.classList.add('shake');
      speak('Try again');
      setTimeout(function(){ btn.classList.remove('shake'); }, 600);
    }
  });
}
function showSpell(){
  var words = [{w:'cat', e:'🐱'}, {w:'dog', e:'🐶'}, {w:'sun', e:'☀️'}, {w:'bus', e:'🚌'}, {w:'apple', e:'🍎'}];
  var pick = words[Math.floor(Math.random() * words.length)];
  var pool = pick.w.split('').concat(['a','e','o','s','t'].slice(0, 3)).sort(function(){ return Math.random() - 0.5; });
  body.innerHTML = '<h2>Spelling Practice</h2>' +
    '<div style="text-align:center;font-size:3rem;line-height:1">' + pick.e + '</div>' +
    '<p class="question">Tap the letters to spell <b>' + pick.w.toUpperCase() + '</b></p>' +
    '<div class="status" id="spellOut" style="min-height:36px">_ _ _</div>' +
    '<div class="tiles" style="grid-template-columns:repeat(4,1fr)" id="spellPool">' +
      pool.map(function(ch, i){ return '<button class="tile" data-i="' + i + '" style="min-height:60px">' + ch.toUpperCase() + '</button>'; }).join('') +
    '</div><div style="text-align:center;margin-top:12px"><button class="btn ghost" id="spellNew">New word</button></div>';
  var typed = '';
  document.getElementById('spellNew').onclick = showSpell;

    var btn = ev.target.closest('.tile');

    var ch = pool[Number(btn.dataset.i)];

    document.getElementById('spellOut').textContent =
      typed.toUpperCase().split('').join(' ');
    if(typed === pick.w){
      addStar();
      speak('Well done! ' + pick.w);
      document.getElementById('spellOut').textContent = pick.w.toUpperCase() + ' ✓';
      setTimeout(showSpell, 1600);
    }else if(typed.length >= pick.w.length || pick.w.indexOf(typed) !== 0){
      speak('Almost. Try again');
      typed = '';
      setTimeout(function(){ document.getElementById('spellOut').textContent = '_ '.repeat(pick.w.length).trim(); }, 400);
    }
  });
}

var wheelAngle = 0, wheelSpinning = false, wheelItems = ['Apple', 'Ball', 'Cat', 'Dog', 'Egg', 'Fish'];
function drawWheel(){
  var canvas = document.getElementById('wheelCanvas');
  if(!canvas) return;
  var ctx = canvas.getContext('2d');
  var cx = 200, cy = 200, r = 180;
  var seg = (Math.PI * 2) / wheelItems.length;
  var colors = ['#fef08a', '#fbbf24', '#fcd34d', '#fef08a', '#fbbf24', '#fcd34d'];
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(wheelAngle * Math.PI / 180);
  for(var i = 0; i < wheelItems.length; i++){
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, seg * i, seg * (i + 1));
    ctx.closePath();
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.strokeStyle = '#d97706';
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.save();
    ctx.rotate(seg * i + seg / 2);
    ctx.fillStyle = '#222';
    ctx.font = 'bold 17px "Trebuchet MS", sans-serif';
    ctx.fillText(wheelItems[i], r * 0.42, 8);
    ctx.restore();
  }
  ctx.restore();
  ctx.fillStyle = '#ef4444';
  ctx.beginPath();
  ctx.moveTo(cx, 8);
  ctx.lineTo(cx - 12, 28);
  ctx.lineTo(cx + 12, 28);
  ctx.closePath();
  ctx.fill();
}
function spinWheel(){
  if(wheelSpinning || !document.getElementById('wheelCanvas')) return;
  wheelSpinning = true;
  document.getElementById('wheelResult').textContent = '';
  var total = 2000 + Math.random() * 2500;
  var start = performance.now();
  function step(now){
    var p = Math.min((now - start) / total, 1);
    var ease = 1 - Math.pow(1 - p, 3);
    wheelAngle += 12 * (1 - ease);
    drawWheel();
    if(p < 1){ requestAnimationFrame(step); }
    else{
      wheelSpinning = false;
      var segAngle = 360 / wheelItems.length;
      var idx = Math.floor((((wheelAngle % 360) + 360) % 360) / segAngle);
      document.getElementById('wheelResult').textContent = 'You got: ' + wheelItems[idx];
      speak(wheelItems[idx]);
    }
  }
  requestAnimationFrame(step);
}
var memoryCards = [], flippedCards = [], memoryLocked = false;
function initMemoryGame(){
  var animals = ['🐱','🐶','🐰','🐦','🐸','🐼','🦁','🐮'];
  memoryCards = animals.concat(animals).sort(function(){ return Math.random() - 0.5; });
  flippedCards = [];
  memoryLocked = false;
  body.innerHTML = '<h2>Memory Match</h2><div id="memoryStatus">Find the matching animal pairs!</div>' +
    '<div class="memory-grid" id="memoryGrid"></div>' +
    '<div style="text-align:center"><button class="btn ghost" id="memRestart">Restart</button></div>';
  document.getElementById('memRestart').onclick = initMemoryGame;
  var grid = document.getElementById('memoryGrid');
  memoryCards.forEach(function(emoji, i){
    var b = document.createElement('button');
    b.className = 'memory-card';
    b.dataset.value = emoji;
    b.textContent = '?';
    b.onclick = function(){ flipCard(b); };
    grid.appendChild(b);
  });
}
function flipCard(card){
  if(memoryLocked || card.classList.contains('flipped') || card.classList.contains('matched')) return;
  card.classList.add('flipped');
  card.textContent = card.dataset.value;
  flippedCards.push(card);
  if(flippedCards.length < 2) return;
  memoryLocked = true;
  var c1 = flippedCards[0], c2 = flippedCards[1];
  if(c1.dataset.value === c2.dataset.value){
    c1.classList.add('matched');
    c2.classList.add('matched');
    flippedCards = [];
    memoryLocked = false;
    speak('A match!');
    if(document.querySelectorAll('.memory-card:not(.matched)').length === 0){
      document.getElementById('memoryStatus').textContent = 'All pairs found! You win!';
      addStar();
      speak('All pairs found. You win!');
    }
  }else{
    setTimeout(function(){
      c1.classList.remove('flipped'); c2.classList.remove('flipped');
      c1.textContent = '?'; c2.textContent = '?';
      flippedCards = []; memoryLocked = false;
    }, 900);
  }
}
var puzzleArr = [], puzzleGoal = [1,2,3,4,5,6,7,8,0], puzzleSolved = false;
function initPuzzle(){
  puzzleSolved = false;
  puzzleArr = puzzleGoal.slice();
  for(var i = 0; i < 60; i++){
    var empty = puzzleArr.indexOf(0);
    var moves = puzzleMoves(empty);
    var pick = moves[Math.floor(Math.random() * moves.length)];
    var t = puzzleArr[empty];
    puzzleArr[empty] = puzzleArr[pick];
    puzzleArr[pick] = t;
  }
  body.innerHTML = '<h2>3×3 Sliding Puzzle</h2><div id="puzzleStatus">Slide the numbers into order</div>' +
    '<div class="puzzle-grid" id="puzzleGrid"></div>' +
    '<div style="text-align:center"><button class="btn ghost" id="puzRestart">Shuffle again</button></div>';
  document.getElementById('puzRestart').onclick = initPuzzle;
  renderPuzzle();
}
function puzzleMoves(empty){
  var out = [], r = Math.floor(empty / 3), c = empty % 3;
  if(r > 0) out.push(empty - 3);
  if(r < 2) out.push(empty + 3);
  if(c > 0) out.push(empty - 1);
  if(c < 2) out.push(empty + 1);
  return out;
}
function renderPuzzle(){
  var grid = document.getElementById('puzzleGrid');
  grid.innerHTML = '';
  puzzleArr.forEach(function(num, idx){
    var b = document.createElement('button');
    b.className = 'puzzle-cell' + (num === 0 ? ' empty' : '');
    b.textContent = num === 0 ? '' : num;
    b.onclick = function(){ puzzleClick(idx); };
    grid.appendChild(b);
  });
  var win = puzzleArr.every(function(v, i){ return v === puzzleGoal[i]; });
  if(win){
    document.getElementById('puzzleStatus').textContent = 'Complete! Well done!';
    if(!puzzleSolved){ puzzleSolved = true; addStar(); speak('Puzzle complete! Well done!'); }
  }
}
function puzzleClick(idx){
  var empty = puzzleArr.indexOf(0);
  if(puzzleMoves(empty).indexOf(idx) === -1) return;
  var t = puzzleArr[empty];
  puzzleArr[empty] = puzzleArr[idx];
  puzzleArr[idx] = t;
  renderPuzzle();
}
function makeQR(){
  var box = document.getElementById('qrbox');
  var text = document.getElementById('qrtext').value;
  box.innerHTML = '';
  if(!text || !window.QRCode){ box.textContent = 'Type something first.'; return; }
  window.QRCode.toCanvas(text, { width: 220 }, function(err, canvas){
    if(err){ box.textContent = 'Could not make the QR code.'; return; }
    box.appendChild(canvas);
  });
}
